name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - run: npm install -g cordova@12
      - run: cordova platform add android@12
      - run: cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
