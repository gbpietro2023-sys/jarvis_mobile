name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d $HOME
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH
      - run: npm install -g cordova@12
      - run: cordova platform add android@12
      - run: cordova plugin add cordova-plugin-geolocation
      - run: cordova plugin add cordova-plugin-tts
      - run: cordova plugin add cordova-plugin-inappbrowser
      - run: cordova plugin add cordova-plugin-speechrecognition
      - name: Build debug APK
        run: cordova build android --debug
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cordova build android --release --packageType=apk -- \
            --keystore="$(pwd)/release.keystore" \
            --storePassword="$KEYSTORE_PASSWORD" \
            --alias="$KEY_ALIAS" \
            --password="$KEY_PASSWORD"
      - name: Remove keystore
        if: always()
        run: rm -f release.keystore
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk-debug
          path: platforms/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk-release
          path: platforms/android/app/build/outputs/apk/release/*.apk
